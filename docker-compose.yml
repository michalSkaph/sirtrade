services:
  sirtrade-ui:
    build: .
    container_name: sirtrade-ui
    environment:
      - SIRTRADE_ENABLE_EMBEDDED_WORKER=0
      - SIRTRADE_COPY_TRADER_LIST_URL=${SIRTRADE_COPY_TRADER_LIST_URL:-}
      - SIRTRADE_COPY_TRADER_POSITIONS_URL_TEMPLATE=${SIRTRADE_COPY_TRADER_POSITIONS_URL_TEMPLATE:-}
      - SIRTRADE_COPY_TRADER_HEADERS_JSON=${SIRTRADE_COPY_TRADER_HEADERS_JSON:-}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  sirtrade-worker:
    build: .
    container_name: sirtrade-worker
    command: ["python", "run_live_worker.py"]
    environment:
      - SIRTRADE_BINANCE_DECISION_SECONDS_SCALP=5
      - SIRTRADE_BINANCE_DECISION_SECONDS_INTRADAY=10
      - SIRTRADE_BINANCE_DECISION_SECONDS_SWING=30
      - SIRTRADE_COPY_TRADER_LIST_URL=${SIRTRADE_COPY_TRADER_LIST_URL:-}
      - SIRTRADE_COPY_TRADER_POSITIONS_URL_TEMPLATE=${SIRTRADE_COPY_TRADER_POSITIONS_URL_TEMPLATE:-}
      - SIRTRADE_COPY_TRADER_HEADERS_JSON=${SIRTRADE_COPY_TRADER_HEADERS_JSON:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  sirtrade-health:
    build: .
    container_name: sirtrade-health
    command: ["python", "run_health_server.py"]
    environment:
      - SIRTRADE_HEALTH_PORT=8080
      - SIRTRADE_WORKER_STALE_SECONDS=90
      - SIRTRADE_COPY_TRADER_LIST_URL=${SIRTRADE_COPY_TRADER_LIST_URL:-}
      - SIRTRADE_COPY_TRADER_POSITIONS_URL_TEMPLATE=${SIRTRADE_COPY_TRADER_POSITIONS_URL_TEMPLATE:-}
      - SIRTRADE_COPY_TRADER_HEADERS_JSON=${SIRTRADE_COPY_TRADER_HEADERS_JSON:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
